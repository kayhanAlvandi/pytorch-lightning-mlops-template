
name: Build and Push Image
description: Build and push Docker image to GHCR
inputs:
  image_name:
    description: 'Name of the image to build and push'
    required: true
  dockerfile:
    description: 'Path to Dockerfile'
    required: true
  extra_tag:
    description: 'Extra tag to add to the image'
    required: false
    default: ''
  token:
    description: 'GHCR auth token (secrets context is not available in composite actions -- pass it in)'
    required: true



runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}
    
    - uses: docker/setup-buildx-action@v3
    - uses: docker/metadata-action@v5
      id: meta
      with:
        images: ghcr.io/${{ github.repository }}/${{ inputs.image_name }}
        tags: |
          type=raw,value=latest,enable={{is_default_branch}}
          type=sha,prefix=sha-,format=short
          type=semver,pattern={{version}}
          type=raw,value=${{ inputs.extra_tag }},enable=${{ inputs.extra_tag != '' }}
    - uses: docker/build-push-action@v5
      with:
        context: .
        file: ${{ inputs.dockerfile }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max