kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraMounts:
      # DATA_PATH is derived (not hand-set) -- see k8s/Makefile, it's always
      # "<repo>/data" on whatever machine this runs on.
      - hostPath: ${DATA_PATH}
        containerPath: /mnt/data
      - hostPath: ${O_DRIVE_PATH}
        containerPath: /mnt/o-drive
      - hostPath: ${TOOLS_LIB_PATH}
        containerPath: /mnt/tools
      # rw in the pods that use it (drift-report, quality-report) -- this
      # extraMount is just node-level plumbing, read-only-ness is set on the
      # pod's volumeMount, not here.
      - hostPath: ${REPORTS_PATH}
        containerPath: /mnt/monitoring-reports
