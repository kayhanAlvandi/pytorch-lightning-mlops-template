# Ephemeral job: runs the Evidently drift report for the served model and
# writes the result to Postgres + monitoring/reports/. Lightweight dedicated
# image (no torch/mlflow/timm). This is deliberately the shape a scheduler
# (cron/Airflow) will wrap later -- same image, same command, just a
# different trigger.
#
# Needs pg_network (Postgres) and ml-platform (to reach the api service's
# /model endpoint for run_id resolution; api is attached to both).
services:
  drift-report:
    build:
      context: ../../..
      dockerfile: docker/jobs/monitoring/Dockerfile
    image: image_classifier_drift
    container_name: drift_report
    env_file: .env.monitoring
    volumes:
      - ../../../monitoring/reports:/app/monitoring/reports:rw
    networks:
      - ml-platform
      - pg_network

networks:
  ml-platform:
    external: true
  pg_network:
    external: true
