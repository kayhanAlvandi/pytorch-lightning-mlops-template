# Ephemeral job: scores the registered benchmark dataset with a specific
# model (real inference required). Reuses the api service's image/build
# (already has mlflow/torch/timm/psycopg -- no new image needed) instead of a
# dedicated Dockerfile; only monitoring/ is bind-mounted so editing the job
# script doesn't require rebuilding the (heavier, long-running) api image.
#
# Benchmark samples themselves are registered separately by register-benchmark
# (docker/jobs/monitoring, lightweight image -- no inference needed there).
services:
  compute-benchmark:
    build:
      context: ../../..
      dockerfile: docker/services/api/Dockerfile
    image: image_classifier_api
    container_name: compute_benchmark
    env_file: .env.api
    volumes:
      - ${O_DRIVE_PATH}:/mnt/O:rw
      - ../../../monitoring:/app/monitoring:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - ml-platform
      - pg_network

networks:
  ml-platform:
    external: true
  pg_network:
    external: true
