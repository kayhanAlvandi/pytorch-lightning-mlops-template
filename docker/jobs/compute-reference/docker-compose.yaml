# Ephemeral job: computes reference (validation-set) predictions for drift
# detection. Reuses the api service's image/build (already has
# mlflow/torch/timm/psycopg -- no new image needed) instead of a dedicated
# Dockerfile; only monitoring/ is bind-mounted so editing the job script
# doesn't require rebuilding the (heavier, long-running) api image.
services:
  compute-reference:
    build:
      context: ../../..
      dockerfile: docker/services/api/Dockerfile
    image: image_classifier_api
    container_name: compute_reference
    env_file: .env.api
    volumes:
      - ${O_DRIVE_PATH}:/mnt/O:rw
      - ../../../monitoring:/app/monitoring:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - ml-platform
      - pg_network

networks:
  ml-platform:
    external: true
  pg_network:
    external: true
